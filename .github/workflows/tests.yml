# Runs every test suite on each pull request and each push to main.
#
# This repo is public, so pull requests can come from anyone. The jobs use
# no secrets and can only read the code: `pull_request` (not
# `pull_request_target`) never hands a fork's code the repo's secrets.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
        working-directory: relay

  benchkit:
    name: BenchKit
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      # Workbench needs Xcode 27. Keep in step with the README.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: BenchKit

  mac:
    name: Mac app
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Workbench needs Xcode 27. Keep in step with the README.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      # libghostty takes several minutes to build from source, and only
      # changes when the script that pins its version does.
      - name: Restore libghostty
        id: ghostty
        uses: actions/cache@v6
        with:
          path: |
            vendor/GhosttyKit.xcframework
            vendor/ghostty-resources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ghostty.sh') }}
      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: make ghostty
      # No signing team here, so the app is signed to run locally. That
      # also makes it an unofficial build: no updates, no analytics.
      - name: Sign to run locally
        run: printf 'DEVELOPMENT_TEAM =\n' > Config/Local.xcconfig
      - run: make test
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-log
          path: build/last-test.log
